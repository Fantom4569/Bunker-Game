<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гра БУНКЕР - Apocalypse Edition</title>
    <style>
        /* --- ТВОЇ ОСНОВНІ СТИЛІ --- */
        body {
            background-color: #2b2b2b;
            /* Переконайся, що картинка badfon... лежить поруч з файлом */
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('badfon-gorod-zdanie-apokalipsis.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            color: white;
        }

        /* --- ЛОГІКА ЕКРАНІВ --- */
        .screen { display: none; } /* Ховаємо всі екрани за замовчуванням */
        .active { display: block; animation: fadeIn 0.5s; } /* Показуємо активний */

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        h1, h2 {
            color: #f4d03f;
            text-transform: uppercase;
            text-shadow: 4px 4px 0px #000;
            letter-spacing: 3px;
            background-color: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 10px 20px;
            border-radius: 10px;
        }
        h1 { font-size: 3.5rem; margin-bottom: 30px; }
        h2 { font-size: 2.5rem; }

        /* --- КНОПКИ --- */
        button {
            background-color: #c0392b;
            color: #fff;
            border: 4px solid #fff;
            padding: 15px 40px;
            font-size: 20px;
            font-family: 'Impact', sans-serif;
            text-transform: uppercase;
            cursor: pointer;
            margin: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: 0.2s;
            border-radius: 50px;
            letter-spacing: 2px;
        }
        button:hover {
            background-color: #e74c3c;
            transform: scale(1.05);
            box-shadow: 0 0 20px #e74c3c;
        }
        button.secondary {
            background-color: #555;
            border-color: #999;
            font-size: 16px;
            padding: 10px 30px;
        }

        /* --- ПОЛЯ ВВОДУ --- */
        input[type="text"] {
            padding: 15px;
            font-size: 20px;
            border-radius: 10px;
            border: 3px solid #f4d03f;
            background-color: #111;
            color: #fff;
            text-align: center;
            font-family: 'Courier New', monospace;
        }

        /* --- КОНТЕЙНЕР КАРТОК --- */
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding-bottom: 50px;
        }

        /* --- СТИЛЬ КАРТКИ --- */
        .card {
            width: 240px;
            height: 340px;
            background-color: #f4d03f;
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 2px, transparent 2px, transparent 10px);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.7);
            transition: transform 0.2s;
            border: 8px solid #fff;
            position: relative;
            color: #111;
        }
        .card:hover { transform: scale(1.05) rotate(1deg); z-index: 10; }
        .card-header {
            background-color: #111;
            color: #f4d03f;
            padding: 12px 5px;
            text-transform: uppercase;
            font-size: 20px;
            border-bottom: 2px solid rgba(0,0,0,0.2);
        }
        .card-body {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            font-size: 20px;
            line-height: 1.2;
            text-transform: uppercase;
            word-wrap: break-word;
        }
        .card-footer {
            background-color: #111;
            color: #fff;
            padding: 8px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }

        /* КОЛЬОРИ РАМОК */
        .border-white { border-color: #ecf0f1; }
        .border-orange { border-color: #e67e22; }
        .border-red { border-color: #c0392b; }
        .border-green { border-color: #27ae60; }
        .border-blue { border-color: #2980b9; }
        .border-cyan { border-color: #16a085; }
        .border-purple { border-color: #8e44ad; }
        .border-grey { border-color: #7f8c8d; }

        /* --- КАТАСТРОФА --- */
        #catastrophe-block {
            background-color: rgba(17, 17, 17, 0.95);
            color: #c0392b;
            border: 4px solid #c0392b;
            border-radius: 20px;
            padding: 30px;
            max-width: 700px;
            margin: 40px auto;
            display: none;
            font-family: 'Courier New', monospace;
            text-align: left;
            box-shadow: 0 0 50px rgba(192, 57, 43, 0.3);
        }
        #catastrophe-block strong { color: #f4d03f; }

        /* --- ПІДПИС --- */
        .fantom-signature {
            font-family: 'Courier New', monospace;
            color: rgba(255, 255, 255, 0.4);
            font-size: 16px;
            margin-top: auto;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div id="main-menu" class="screen active">
        <h1>☢️ БУНКЕР ☢️</h1>
        <p style="font-size: 1.5em; margin-bottom: 40px;">Обери свій шлях виживання:</p>
        
        <button id="btn-mode-single">👤 Одиночна гра</button>
        <br>
        <button id="btn-mode-multi">👥 Мультиплеєр</button>
    </div>

    <div id="single-player-screen" class="screen">
        <h2>Одиночний режим</h2>
        
        <div class="controls">
            <button id="btn-generate-single">Отримати досьє</button>
            <button id="btn-show-catastrophe" style="background-color: #000; border-color: #c0392b; color: #c0392b;">⚠️ ВІДКРИТИ КАТАСТРОФУ</button>
        </div>

        <div class="container" id="cards-container">
            </div>

        <div id="catastrophe-block">
            <h2 id="cat-title" style="border:none; background:none; text-align: center;"></h2>
            <p><strong>📜 Історія:</strong> <span id="cat-story"></span></p>
            <p><strong>🏠 Бункер:</strong> <span id="cat-bunker"></span></p>
            <p><strong>🌡️ Умови:</strong> <span id="cat-conditions"></span></p>
        </div>

        <hr style="border-color: #444; margin: 40px 0;">
        <button class="secondary" onclick="showScreen('main-menu')">⬅ Назад в меню</button>
    </div>

    <div id="lobby-screen" class="screen">
        <h2>Лобі гри</h2>
        <h3>Кімната: <span id="lobby-room-code" style="color:#fff;">----</span></h3>
        
        <div class="lobby-controls" style="margin: 30px;">
            <input type="text" id="input-room-code" placeholder="Код кімнати">
            <br><br>
            <button id="btn-join-room">Приєднатись</button>
            <button id="btn-create-room">Створити кімнату</button>
        </div>

        <h4>Гравці в кімнаті:</h4>
        <div id="lobby-players-list">
            <p style="color: gray;">Поки що порожньо...</p>
        </div>

        <hr style="border-color: #444; margin: 40px 0;">
        <button class="secondary" onclick="showScreen('main-menu')">⬅ Назад в меню</button>
    </div>

    <div class="fantom-signature">by Fantom/</div>

    <script type="module" src="app.js"></script>
</body>
</html>
